name: Feature request
description: Suggest an improvement to LTBridge.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this feature solve?
      description: Describe the need or limitation you have encountered.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have tried.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples or context that would help explain the request.
    validations:
      required: false
